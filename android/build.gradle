buildscript {
    repositories {
        google()
        mavenCentral()
        // TransistorSoft remote repo disabled - using local patched AARs
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.4.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // Patched flutter_background_geolocation local AARs
        maven {
            url "${project(':flutter_background_geolocation').projectDir}/libs"
        }
    }
}
// Force compatible Play Services Location version for flutter_background_geolocation
rootProject.ext.playServicesLocationVersion = '21.0.1'
rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
