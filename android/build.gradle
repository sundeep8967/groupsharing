buildscript {
    repositories {
        google()
        mavenCentral()
        // TransistorSoft remote repo disabled - using local patched AARs
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.4.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // Local patched AARs for flutter_background_geolocation
        maven {
            url "${System.getProperty('user.home')}/.pub-cache/hosted/pub.dev/flutter_background_geolocation-4.18.2/android/libs"
        }
    }
}
rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
